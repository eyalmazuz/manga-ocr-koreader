[package]
name = "mangaocr-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"
description = "Standalone Google Lens OCR worker for the KOReader Manga OCR plugin"
publish = false

[[bin]]
name = "mangaocr-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrome_lens_ocr = { version = "=0.3.0", path = "vendor/chrome_lens_ocr-0.3.0" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "=0.25.9", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "pnm",
    "tiff",
    "webp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
